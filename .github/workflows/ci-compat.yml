# Compat probe: Moodle 4.5+ / 5.x (API de entities moderna).
# Moodle ≤ 4.4 usa get_default_table_aliases + APIs antigas — incompatível com este plugin.
# Objetivo: ver em quais branches o PHPUnit passa para decidir requires/supported.
#
# Em branches != 5.2 o job baixa temporariamente o requires (não altera o repo).
# allow_fail=true nas sondagens; 5.2 continua bloqueante.

name: CI Moodle compat

on: [push, pull_request]

permissions:
  contents: read

jobs:
  compat:
    name: ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.allow_fail }}

    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Moodle 4.5 (mínimo teórico com API de entities atual) ----
          - php: "8.1"
            moodle-branch: MOODLE_405_STABLE
            postgres: postgres:15
            allow_fail: true
          - php: "8.3"
            moodle-branch: MOODLE_405_STABLE
            postgres: postgres:15
            allow_fail: true

          # ---- Moodle 5 ----
          - php: "8.2"
            moodle-branch: MOODLE_500_STABLE
            postgres: postgres:16
            allow_fail: true
          - php: "8.3"
            moodle-branch: MOODLE_501_STABLE
            postgres: postgres:16
            allow_fail: true
          - php: "8.3"
            moodle-branch: MOODLE_502_STABLE
            postgres: postgres:17
            allow_fail: false
          - php: "8.4"
            moodle-branch: MOODLE_502_STABLE
            postgres: postgres:17
            allow_fail: false

    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Relax version.php for probe (non-5.2)
        if: matrix.moodle-branch != 'MOODLE_502_STABLE'
        run: |
          # Moodle 4.5.0 — abaixo disso a API de entities é outra geração
          sed -i 's/\$plugin->requires[[:space:]]*=.*/$plugin->requires = 2024100700;/' plugin/version.php
          sed -i 's/\$plugin->supported[[:space:]]*=.*/$plugin->supported = [405, 502];/' plugin/version.php
          echo "Probe requires/supported:"
          grep -E 'requires|supported' plugin/version.php

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, intl, xml, mbstring, soap
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Validate
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Mark cancelled as failed
        if: ${{ cancelled() }}
        run: exit 1
